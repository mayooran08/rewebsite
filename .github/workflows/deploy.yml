name: Build and deploy site

# Rebuilds every page (including the blog) from the files in the repo, then publishes to GitHub Pages.
# Needs: Settings > Pages > Build and deployment > Source = "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate pages
        run: node tools/build.mjs

      - name: Assemble site folder
        run: |
          mkdir _site
          cp -r index.html 404.html robots.txt sitemap.xml style.css script.js CNAME assets data en fr _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
